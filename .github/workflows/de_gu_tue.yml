name: GU poniedzialek send

# Send partia 1 poniedziałek 06:30 Europe/Warsaw.
on:
  schedule:
    - cron: "30 6 * * 1"
      timezone: Europe/Warsaw
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Opcjonalnie run ID zrodla (np. prep z poniedzialku). Puste = najnowszy mon."
        required: false
        type: string
      artifact_name:
        description: "Nazwa artefaktu zrodla (domyslnie de-gu-wyniki-mon)"
        required: false
        type: string
        default: "de-gu-wyniki-mon"
      force_resend:
        description: Ponowna wysylka (ignoruj suppression i sent)
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: gu-pipeline
  cancel-in-progress: false

env:
  SCRAPER_TIMEZONE: Europe/Warsaw
  DISABLE_SEND_WINDOW: "1"
  DISABLE_EMAIL_ATTACHMENT: "1"
  MAX_SEND_PER_RUN: "20"
  KANBUD_PROJECT_ROOT: ${{ github.workspace }}/libs
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: "465"
  SMTP_SSL: "1"
  IMAP_HOST: imap.gmail.com
  IMAP_PORT: "993"
  IMAP_SSL: "1"
  MAIL_ARCHIVE_IMAP: "1"

jobs:
  guard:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.window.outputs.active }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gu-gha-window-guard
        id: window

  send:
    needs: guard
    if: ${{ needs.guard.outputs.active == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-scraper

      - name: Resolve artifact run (zrodlo wynikow)
        id: artifact_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FORCED="${{ github.event_name == 'workflow_dispatch' && inputs.artifact_run_id || '' }}"
          ARTIFACT="${{ github.event_name == 'workflow_dispatch' && inputs.artifact_name || 'de-gu-wyniki-mon' }}"
          if [ -n "$FORCED" ]; then
            RUN_ID="$FORCED"
          else
            RUN_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name=="de-gu-wyniki-mon" and .expired==false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::Brak artefaktu (uruchom prep lub podaj artifact_run_id)"
            exit 1
          fi
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "Pobieram $ARTIFACT z run $RUN_ID"

      - name: Download cache from zrodlo
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_run.outputs.artifact || 'de-gu-wyniki-mon' }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.artifact_run.outputs.run-id }}
          path: .

      - name: Send emails Hurt Matbud (max 20 / run, bez PPTX)
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          ARGS="--send-emails-only --ignore-send-window"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_resend }}" = "true" ]; then
            ARGS="$ARGS --force-resend"
          fi
          python de_gu_bauunternehmen_scraper.py $ARGS

      - name: Upload Wyniki artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: de-gu-wyniki-tue
          path: |
            Wyniki/
            wyslane/
